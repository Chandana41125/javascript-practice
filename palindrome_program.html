<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str = prompt("Enter a string");

        // reverse string
        let revStr = str.split("").reverse().join("");

        // check palindrome
        if (str === revStr) {
            console.log("Palindrome");
        } else {
            console.log("Not a Palindrome");
        }
    </script>
</body>
</html>
