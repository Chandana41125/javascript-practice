<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = [10,20,30,40,50,60];

        let filtered_result = num.filter((x)=>{return x > 30});
        console.log(filtered_result);

        let mapped_result = num.map(x=>{return x*2});
        console.log(mapped_result);

        let reduce_result = num.reduce((x,val)=>{return x+val},0);
        console.log(reduce_result);
    </script>
</body>
</html>
