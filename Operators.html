<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 10;
        let b = 5;
        // ARITHMETIC OPERATORS
        console.log(a+b);
        console.log(a-b);
        console.log(a*b);
        console.log(a/b);
        console.log(a%b);
        console.log(a**b);
        console.log(a++);
        console.log(a);
        console.log(a--);
        console.log(a);

        // ASSIGNMENT OPERATORS
        var c = 10;
        var d = 5;
        console.log(c+=d);
        console.log(c-=d);
        console.log(c*=d);
        console.log(c/=d);

        // RELATIONAL OPERATORS

        var e = 10;
        var f = 5;
        console.log(e>f);
        console.log(e<f);
        console.log(e>=f);
        console.log(e<=f);
        console.log(e==f);
        console.log(e!=f);
        console.log(e===f);
        console.log(e!==f);

        // TYPE OPERATORS
        console.log(typeof e);
        console.log(typeof "Hello");

        // CONDITIONAL (TERNARY) OPERATOR
        var g = 10;
        var h = 5;
        console.log(g > h ? "g is greater than h" : "g is not greater than h");
    </script>
</body>
</html>
