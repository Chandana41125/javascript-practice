<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>   
    // String examples
    var str1 = "hello";
    var str2 = 'hello';
    var str3 = `hello`;

    console.log(str1);
    console.log(str2);
    console.log(str3);


    var str = " Hello World ";

    // length
    console.log(str.length);

    // case conversion
    console.log(str.toLowerCase());
    console.log(str.toUpperCase());

    // trim
    console.log(str.trim());
    console.log(str.trimStart());
    console.log(str.trimEnd());

    // character access
    console.log(str.charAt(1));

    // index
    console.log(str.indexOf("o"));
    console.log(str.lastIndexOf("o"));

    // replace
    console.log(str.replace("H", "R"));

    // concat
    var str2 = " JS";
    console.log(str.concat(str2));

    // slice
    console.log(str.slice(0, 5));

    // repeat
    console.log("Hi ".repeat(3));

    // split
    console.log(str.split(" "));


    //Number Datatype example
        var a =10;
        console.log(a);

        var b =10.5;
        console.log(b);

        var c =1/0;
        console.log(c);

        var d = -1/0;
        console.log(d);


    //Boolean Datatype example


        var e = Boolean(true);
        console.log(e);
        var f = Boolean(1);
        console.log(f);
        var g = Boolean(-1);
        console.log(g);
        var h = Boolean("hello");
        console.log(h);
        var i = Boolean(100);
        console.log(i);

        var j = Boolean(false);
        console.log(j);
        var k = Boolean(0);
        console.log(k);
        var l = Boolean("");
        console.log(l);
        var m = Boolean(NaN);
        console.log(typeof m);
        var n = Boolean(undefined);
        console.log(typeof n);
        var o = Boolean(null);
        console.log(typeof o);


    //undefined Datatype example

        var p;
        console.log(typeof p);


    //Null Datatyoe example

        var q = null;
        console.log(typeof q);


    //BigInt Datatype example
    //there are three ways to declare a bigInt datatype

        var r = 1n;
        console.log(typeof r);
        var s = BigInt(1);
        console.log(typeof s);
        var t = BigInt("18787329792121093874");
        console.log(typeof t);

</script> 
</body>
</html>
